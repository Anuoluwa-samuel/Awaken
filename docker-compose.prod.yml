# Self-hosted production: the app + its own Postgres, on a VM that also runs other projects
# behind a shared Caddy. See docs/DEPLOYMENT.md. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# --env-file is required even though the app's own variables come from `env_file:` below:
# it's what fills in ${POSTGRES_PASSWORD} and ${CADDY_NETWORK} in this file itself (Compose
# only reads a plain ".env" for that by default, and this project's local dev already owns
# that name for `pnpm dev`).
#
# Service names are prefixed (awaken-app / awaken-db) so they don't collide with other
# projects' services on the shared "caddy" network.
services:
  awaken-app:
    build: .
    container_name: awaken-app
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    depends_on:
      awaken-db:
        condition: service_healthy
    networks:
      - internal
      - caddy

  # Not part of the running stack (profile "tools": `docker compose … up -d` skips it).
  # Built from the `builder` Dockerfile stage, which — unlike awaken-app's final image — still
  # has devDependencies and the repo source, so `pnpm db:deploy` / `admin:grant` / `db:check` work:
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm awaken-tools pnpm db:deploy
  awaken-tools:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    env_file: .env.production
    networks:
      - internal

  awaken-db:
    image: postgres:17-alpine
    container_name: awaken-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-awaken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-awaken}
    volumes:
      - awaken_pgdata:/var/lib/postgresql/data
    # Loopback-only: reachable from scripts/backup-local.sh running on the VM itself (docs/BACKUPS.md),
    # never from the internet or other containers outside the "internal" network.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awaken}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  awaken_pgdata:

networks:
  # Only awaken-db is on this one: nothing but the app can reach the database.
  internal: {}
  # Your existing Caddy's network. Check its actual name (`docker network ls`) and set
  # CADDY_NETWORK in .env.production if it isn't "caddy_net".
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy_net}
