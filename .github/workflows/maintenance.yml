name: Daily maintenance

# Vercel Cron used to trigger this (vercel.json). Self-hosted, nothing on the VM's schedule
# has a reason to know about the app, so GitHub Actions calls the endpoint instead — the same
# pattern as reminders.yml, and it reuses the same SITE_URL and CRON_SECRET secrets.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the maintenance endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_URL or CRON_SECRET is not set, so the daily clean-up is off. See docs/DEPLOYMENT.md."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/maintenance"
