name: Backup database

# Nightly: reads the production database, keeps an encrypted copy here for 30 days, and refreshes the
# separate backup database. It never writes to production. Setup and restore: docs/BACKUPS.md.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres 17 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Back up and verify
        env:
          SOURCE_DATABASE_URL: ${{ secrets.BACKUP_SOURCE_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_TARGET_DATABASE_URL }}
          OUTPUT: awaken-backup.dump
        run: sh scripts/backup-database.sh

      - name: Encrypt the copy
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output awaken-backup.dump.gpg awaken-backup.dump
          rm -f awaken-backup.dump

      - uses: actions/upload-artifact@v4
        with:
          name: awaken-backup-${{ github.run_number }}
          path: awaken-backup.dump.gpg
          retention-days: 30
          if-no-files-found: error
